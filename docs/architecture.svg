<svg viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1080" height="620" fill="#0f1117"/>

  <text x="540" y="40" fill="#ffffff" font-size="20" font-weight="600" text-anchor="middle">PL_Incremental — ADF Incremental Load with Watermark Control Table</text>
  <text x="540" y="62" fill="#7a8296" font-size="12" text-anchor="middle">Source: Lahman Baseball Database (dbo.seriespost)</text>

  <!-- Control table -->
  <rect x="40" y="100" width="220" height="80" rx="8" fill="#1b2130" stroke="#e0a458" stroke-width="2"/>
  <text x="150" y="130" fill="#e0e6f0" font-size="14" text-anchor="middle" font-weight="600">ctrl_table_watermarks</text>
  <text x="150" y="150" fill="#9aa5b8" font-size="11" text-anchor="middle">TableName / WatermarkValue</text>
  <text x="150" y="166" fill="#9aa5b8" font-size="11" text-anchor="middle">LoadStatus</text>

  <!-- Step 1 -->
  <rect x="420" y="100" width="240" height="60" rx="6" fill="#242c40" stroke="#5c6ac4" stroke-width="2"/>
  <text x="540" y="126" fill="#e0e6f0" font-size="13" text-anchor="middle" font-weight="600">1. Get watermark value</text>
  <text x="540" y="144" fill="#9aa5b8" font-size="11" text-anchor="middle">Lookup</text>

  <!-- Source table -->
  <rect x="820" y="100" width="220" height="80" rx="8" fill="#1b2130" stroke="#3d5a80" stroke-width="2"/>
  <text x="930" y="130" fill="#e0e6f0" font-size="14" text-anchor="middle" font-weight="600">dbo.seriespost</text>
  <text x="930" y="150" fill="#9aa5b8" font-size="11" text-anchor="middle">source table</text>
  <text x="930" y="166" fill="#9aa5b8" font-size="11" text-anchor="middle">lastUpdated column</text>

  <!-- Step 2 -->
  <rect x="420" y="220" width="240" height="70" rx="6" fill="#242c40" stroke="#5c6ac4" stroke-width="2"/>
  <text x="540" y="245" fill="#e0e6f0" font-size="13" text-anchor="middle" font-weight="600">2. Lahman to Stagging</text>
  <text x="540" y="262" fill="#9aa5b8" font-size="11" text-anchor="middle">Copy — delta rows only</text>
  <text x="540" y="277" fill="#9aa5b8" font-size="11" text-anchor="middle">truncate + insert, +insertedOn</text>

  <!-- Staging table -->
  <rect x="820" y="225" width="220" height="60" rx="8" fill="#1b2130" stroke="#4caf7d" stroke-width="2"/>
  <text x="930" y="251" fill="#e0e6f0" font-size="14" text-anchor="middle" font-weight="600">SeriesPost_S</text>
  <text x="930" y="269" fill="#9aa5b8" font-size="11" text-anchor="middle">staging (truncated each run)</text>

  <!-- Step 3 -->
  <rect x="420" y="340" width="240" height="70" rx="6" fill="#242c40" stroke="#5c6ac4" stroke-width="2"/>
  <text x="540" y="365" fill="#e0e6f0" font-size="13" text-anchor="middle" font-weight="600">3. Staging to History</text>
  <text x="540" y="382" fill="#9aa5b8" font-size="11" text-anchor="middle">Copy — upsert on pId</text>
  <text x="540" y="397" fill="#9aa5b8" font-size="11" text-anchor="middle">into history table</text>

  <!-- History table -->
  <rect x="820" y="345" width="220" height="60" rx="8" fill="#1b2130" stroke="#4caf7d" stroke-width="2"/>
  <text x="930" y="371" fill="#e0e6f0" font-size="14" text-anchor="middle" font-weight="600">SeriesPost_H</text>
  <text x="930" y="389" fill="#9aa5b8" font-size="11" text-anchor="middle">permanent history table</text>

  <!-- Step 4 -->
  <rect x="420" y="460" width="240" height="60" rx="6" fill="#242c40" stroke="#5c6ac4" stroke-width="2"/>
  <text x="540" y="486" fill="#e0e6f0" font-size="13" text-anchor="middle" font-weight="600">4. Get history watermark</text>
  <text x="540" y="504" fill="#9aa5b8" font-size="11" text-anchor="middle">Lookup — MAX(lastUpdated)</text>

  <!-- Step 5 -->
  <rect x="40" y="460" width="240" height="70" rx="6" fill="#242c40" stroke="#e0a458" stroke-width="2"/>
  <text x="160" y="485" fill="#e0e6f0" font-size="13" text-anchor="middle" font-weight="600">5. Update Watermmark</text>
  <text x="160" y="502" fill="#9aa5b8" font-size="11" text-anchor="middle">Stored Proc: updateWatermark_new</text>
  <text x="160" y="517" fill="#9aa5b8" font-size="11" text-anchor="middle">writes back to control table</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9aa5b8"/>
    </marker>
  </defs>

  <!-- flow arrows -->
  <path d="M260,140 L420,130" stroke="#e0a458" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M540,180 L540,220" stroke="#5c6ac4" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M820,140 L660,130" stroke="#3d5a80" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M660,255 L820,255" stroke="#4caf7d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M540,290 L540,340" stroke="#5c6ac4" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M820,270 L660,255" stroke="#4caf7d" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <path d="M660,375 L820,375" stroke="#4caf7d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M540,410 L540,460" stroke="#5c6ac4" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M820,385 L660,485" stroke="#4caf7d" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <path d="M420,490 L280,490" stroke="#e0a458" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M160,460 L150,180" stroke="#e0a458" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <text x="540" y="580" fill="#5c6ac4" font-size="12" text-anchor="middle">Watermark in → delta out → staging → upsert to history → new watermark out → watermark written back</text>
</svg>
